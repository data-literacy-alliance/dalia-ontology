abstract	=	The aim of DALIA project is to build a platform for learning material for Research Data Management (RDM) and Data Science. The platform is based on a knowledge graph. We introduce MoDalia, the base ontology of DALIA knowledge graph. Modalia inherits some modules from EduCOR. It includes also modelling of micro -credentials and certificates
citeAs	=	Abdelmoneim Amer Desouki, Marc Fuhrmans, Petra C. Steiner and Frank Lange. "MoDALIA: An Ontology for Educational Material in Research Data Management and Data Science". Revision: v1.0.0. Retrieved from: https://purl.org/ontology/modalia#.
