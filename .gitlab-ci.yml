stages:
  - test
  - deploy

test-job:
  image: python:3.11
  stage: test
  before_script:
    - pip install uv rust-just
  script:
    - just test

pages:
  image: busybox
  stage: deploy
  script:
    - echo "The site will be deployed to $CI_PAGES_URL"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
